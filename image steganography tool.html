<!DOCTYPE html>
<html>
<head>
    <title>Secret Message in Image-Image Steganography Tool</title>
    <style>
        body {
            font-family: Verdana, sans-serif;
            margin: 30px auto;
            max-width: 600px;
            background-color: #eef2f5;
            color: #222;
        }
        h1 {
            text-align: center;
            color: #004080;
            border-bottom: 2px solid #004080;
            padding-bottom: 8px;
        }
        .box {
            background-color: white;
            border: 2px solid #004080;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            color: #004080;
            font-size: 18px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #888;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            margin-top: 12px;
            padding: 10px 15px;
            background-color: #004080;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #002b55;
        }
        .result-box {
            background-color: #f0f8ff;
            border: 1px dashed #004080;
            padding: 10px;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Secret Message in Image-Image Steganography Tool</h1>

    <!-- STEP 1: MAKE KEYS -->
    <div class="box">
        <h2>Step 1: Make Lock & Unlock Keys</h2>
        <p>Type any number to create a Lock Key (for hiding) and an Unlock Key (for reading).</p>
        
        <label>Enter Any Number:</label>
        <input type="number" id="userNum" placeholder="Example: 10">
        
        <button onclick="makeKeys()">Make Keys</button>

        <div class="result-box">
            <p><b>Lock Key (Sender):</b> <span id="showLockKey">None</span></p>
            <p><b>Unlock Key (Receiver):</b> <span id="showUnlockKey">None</span></p>
        </div>
    </div>

    <!-- STEP 2: HIDE MESSAGE -->
    <div class="box">
        <h2>Step 2: Hide Message in Photo</h2>
        
        <label>Choose a Photo:</label>
        <input type="file" id="photoInput" accept="image/*">

        <label>Paste Lock Key:</label>
        <input type="text" id="lockKeyBox" placeholder="Example: LOCK-50">

        <label>Write Your Secret Message:</label>
        <textarea id="msgBox" rows="3" placeholder="Type your secret text here..."></textarea>

        <button onclick="hideMessage()">Hide & Download Photo</button>
    </div>

    <!-- STEP 3: READ MESSAGE -->
    <div class="box">
        <h2>Step 3: Read Hidden Message</h2>

        <label>Upload the Secret Photo (PNG):</label>
        <input type="file" id="secretPhotoInput" accept="image/png" onchange="showPhoto()">

        <div style="text-align: center; margin-top: 10px;">
            <img id="photoPreview" style="max-width: 100%; max-height: 200px; display: none; border: 1px solid #888;">
        </div>

        <label>Paste Unlock Key:</label>
        <input type="text" id="unlockKeyBox" placeholder="Example: UNLOCK-90">

        <button onclick="readMessage()">Unlock & Show Message</button>

        <label>Hidden Message:</label>
        <textarea id="finalOutput" rows="3" readonly placeholder="Secret message will show here..."></textarea>
    </div>

    <!-- Invisible canvas used to read and change image pixels -->
    <canvas id="myCanvas" style="display: none;"></canvas>

    <script>
        // This special word tells the program where the secret message stops
        var STOP_WORD = "###STOP###";

        // 1. Function to create Lock and Unlock keys using simple multiplication
        function makeKeys() {
            var num = parseInt(document.getElementById("userNum").value);
            if (isNaN(num) || num <= 0) {
                alert("Please enter a valid number greater than 0!");
                return;
            }

            var lockKey = "LOCK-" + (num * 5);
            var unlockKey = "UNLOCK-" + (num * 9);

            document.getElementById("showLockKey").innerText = lockKey;
            document.getElementById("showUnlockKey").innerText = unlockKey;
            document.getElementById("lockKeyBox").value = lockKey;
        }

        // Helper function to get the shift number from the key
        function getShiftNumber(key, prefix, multiplier) {
            if (!key.startsWith(prefix)) return null;
            var value = parseInt(key.split("-")[1]);
            if (isNaN(value) || value % multiplier !== 0) return null;
            return (value / multiplier) % 20 + 1;
        }

        // 2. Simple Caesar Cipher: shifts every letter forward or backward
        function scrambleText(text, shift, mode) {
            var answer = "";
            for (var i = 0; i < text.length; i++) {
                var code = text.charCodeAt(i);
                if (mode === "lock") {
                    answer += String.fromCharCode(code + shift);
                } else {
                    answer += String.fromCharCode(code - shift);
                }
            }
            return answer;
        }

        // 3. Function to hide the message inside image pixels
        function hideMessage() {
            var file = document.getElementById("photoInput").files[0];
            var lockKey = document.getElementById("lockKeyBox").value.trim();
            var message = document.getElementById("msgBox").value;

            if (!file || lockKey === "" || message === "") {
                alert("Please select a photo, enter Lock Key, and type a message!");
                return;
            }

            var shift = getShiftNumber(lockKey, "LOCK-", 5);
            if (shift === null) {
                alert("Wrong Lock Key! Please generate one in Step 1.");
                return;
            }

            // Lock the message and add the STOP_WORD at the end
            var lockedMsg = scrambleText(message, shift, "lock") + STOP_WORD;

            // Convert each letter into 8-bit binary (0s and 1s)
            var binaryString = "";
            for (var i = 0; i < lockedMsg.length; i++) {
                var binaryLetter = lockedMsg.charCodeAt(i).toString(2);
                while (binaryLetter.length < 8) {
                    binaryLetter = "0" + binaryLetter;
                }
                binaryString += binaryLetter;
            }

            var reader = new FileReader();
            reader.onload = function(event) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.getElementById("myCanvas");
                    var ctx = canvas.getContext("2d");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    var pixels = imgData.data;

                    // Check if image has enough pixels
                    if (binaryString.length > (pixels.length / 4) * 3) {
                        alert("Message is too long for this small photo!");
                        return;
                    }

                    // Hide 1 bit in each Red, Green, Blue color value
                    // Even color number = 0, Odd color number = 1
                    var bitIndex = 0;
                    for (var i = 0; i < pixels.length; i += 4) {
                        for (var color = 0; color < 3; color++) {
                            if (bitIndex < binaryString.length) {
                                var bit = parseInt(binaryString[bitIndex]);
                                var colorValue = pixels[i + color];

                                if (bit === 0 && colorValue % 2 !== 0) {
                                    pixels[i + color] = colorValue - 1;
                                } else if (bit === 1 && colorValue % 2 === 0) {
                                    pixels[i + color] = colorValue + 1;
                                }
                                bitIndex++;
                            }
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);

                    // Download the new photo automatically
                    var link = document.createElement("a");
                    link.download = "secret_photo.png";
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Show uploaded photo preview in Step 3
        function showPhoto() {
            var file = document.getElementById("secretPhotoInput").files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(event) {
                var preview = document.getElementById("photoPreview");
                preview.src = event.target.result;
                preview.style.display = "inline-block";
            };
            reader.readAsDataURL(file);
        }

        // 4. Function to read the hidden message from image pixels
        function readMessage() {
            var file = document.getElementById("secretPhotoInput").files[0];
            var unlockKey = document.getElementById("unlockKeyBox").value.trim();

            if (!file || unlockKey === "") {
                alert("Please upload the secret photo and paste the Unlock Key!");
                return;
            }

            var shift = getShiftNumber(unlockKey, "UNLOCK-", 9);
            if (shift === null) {
                alert("Wrong Unlock Key! It must start with UNLOCK-");
                return;
            }

            var reader = new FileReader();
            reader.onload = function(event) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.getElementById("myCanvas");
                    var ctx = canvas.getContext("2d");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    var pixels = imgData.data;

                    var bits = "";
                    var hiddenText = "";

                    // Read even/odd values from Red, Green, Blue pixels
                    for (var i = 0; i < pixels.length; i += 4) {
                        for (var color = 0; color < 3; color++) {
                            var bit = pixels[i + color] % 2;
                            bits += bit;

                            // Every 8 bits makes 1 character
                            if (bits.length === 8) {
                                var charCode = parseInt(bits, 2);
                                hiddenText += String.fromCharCode(charCode);
                                bits = "";

                                // Stop when we reach STOP_WORD
                                if (hiddenText.endsWith(STOP_WORD)) {
                                    var scrambledPart = hiddenText.replace(STOP_WORD, "");
                                    var originalMessage = scrambleText(scrambledPart, shift, "unlock");
                                    document.getElementById("finalOutput").value = originalMessage;
                                    return;
                                }
                            }
                        }
                    }
                    document.getElementById("finalOutput").value = "No secret message found in this photo!";
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>

</body>
</html>
